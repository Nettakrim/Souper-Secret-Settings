plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base.archivesName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	exclusiveContent {
		forRepository {maven {url 'https://maven.terraformersmc.com/'}}
		filter {includeGroup 'com.terraformersmc'}
	}

	exclusiveContent {
		forRepository {maven {url 'https://api.modrinth.com/maven'}}
		filter {includeGroup 'maven.modrinth'}
	}

	exclusiveContent {
		forRepository {maven {url 'https://repo.sleeping.town/'}}
		filter {includeGroup 'folk.sisby'}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// put Luminance build in ./libs/
	modImplementation fileTree(dir: 'libs', include: '*.jar')

	// seam is bundled with luminance, but it still needs to be included in the project
	modImplementation "maven.modrinth:perspective_seam:${project.seam}"
	include "maven.modrinth:perspective_seam:${project.seam}"

	modImplementation "folk.sisby:kaleido-config:${project.kaleido_config}"
	include "folk.sisby:kaleido-config:${project.kaleido_config}"

	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 1.18 (1.18-pre2) upwards uses Java 17.
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
tasks.register("quickPlaySingleplayer") {
	group = 'quickPlay'
	description = 'Uses Quick Play to join singleplayer world `New World` on launch.'
	dependsOn(tasks.runClient.args(['--quickPlaySingleplayer', "New World"]))
}
tasks.register("quickPlayMultiplayer") {
	group = 'quickPlay'
	description = 'Uses Quick Play to join multiplayer server `localhost:25565` on launch.'
	dependsOn(tasks.runClient.args(['--quickPlayMultiplayer', "localhost:25565"]))
}
